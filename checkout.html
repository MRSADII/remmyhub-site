<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout — Remmy HUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07090d;color:#e8eaf0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:40px}
.spin{width:46px;height:46px;border-radius:50%;margin:0 auto 22px;border:3px solid rgba(255,255,255,.12);border-top-color:#3ad6b5;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:22px;color:#f8fafc;margin-bottom:8px}
p{color:#8b959e;font-size:14px;max-width:420px;margin:0 auto}
a{color:#3ad6b5}
.badge{display:inline-block;margin-top:26px;background:rgba(58,214,181,.12);border:1px solid rgba(58,214,181,.35);color:#7de8cf;font-size:12px;padding:6px 16px;border-radius:999px}
#err{display:none;margin-top:18px;color:#ff7b7b;font-size:13px}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
<div class="box">
  <div class="spin" id="spinbox"></div>
  <h1>Secure checkout</h1>
  <p id="planline">Remmy HUB — Premium · loading your plan…<br>Card, Apple Pay, Google Pay & PayPal accepted.<br>After payment, your license key is emailed to you automatically.</p>
  <div style="display:flex;justify-content:center;margin:18px 0 4px"><div class="cf-turnstile" data-sitekey="0x4AAAAAAF4hgZFEOEa4Me01" data-theme="dark" data-callback="onVerified"></div></div>
  <p id="err" style="display:none">Checkout didn't open? <a href="#" onclick="openCheckout();return false">Click here to open it manually</a>.</p>
  <span class="badge">🔒 Secured by Paddle · sold from remmyhub.store</span>
</div>
<script>
Paddle.Environment.set("production");
Paddle.Initialize({
  token: "live_8cbe8378ed759789dff5a666f5f",
  eventCallback: function(ev){
    if (ev.name === "checkout.failed") {
      document.getElementById("err").style.display = "block";
    }
  }
});
var PRICES = {
  "pri_01m6x0fa94a2w15csapwdj8sjb": { name: "Weekly Access", amount: "$1.99", suffix: "per week" },
  "pri_01m6x0gwfhtdpqkdgb5k0vrksx": { name: "Monthly Access", amount: "$6.99", suffix: "per month" },
  "pri_01m6x0p7f10sz28nkw8gw9114g": { name: "Yearly Access", amount: "$49.99", suffix: "per year" }
};
var params = new URLSearchParams(window.location.search);
var priceId = params.get("price") || "pri_01m6x0gwfhtdpqkdgb5k0vrksx";
var meta = PRICES[priceId] || PRICES["pri_01m6x0gwfhtdpqkdgb5k0vrksx"];
document.getElementById("planline").innerHTML = "Remmy HUB — <b>" + meta.name + "</b> · " + meta.amount + " " + meta.suffix + "<br>Card, Apple Pay, Google Pay & PayPal accepted.<br>After payment, your license key is emailed to you automatically.";
window.openCheckout = function(){
  var sb = document.getElementById("spinbox");
  if (sb) sb.style.display = "none";
  Paddle.Checkout.open({
    items: [{ priceId: priceId, quantity: 1 }],
    settings: { displayMode: "overlay", theme: "dark", allowLogout: false }
  });
};
var tsWait = setInterval(function(){
  if (window.turnstile && document.querySelector(".cf-turnstile iframe")) {
    clearInterval(tsWait);
    document.getElementById("tslabel").textContent = "Quick human check - then your checkout opens:";
  }
}, 400);
window.onVerified = function(){ openCheckout(); };
setTimeout(function(){ if (!window._tsdone) document.getElementById("err").style.display = "block"; }, 9000);
</script>
</body>
</html>
